<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>System zgłoszeń awarii</title>
    </head>
    <body>
        <h1>System zgłoszeń awarii</h1>
        <p>Oto system zgłoszeń awarii, poniżej znajdują się aktualne awarie: </p>
        <h2>Nowe zgłoszenie</h2>
        <form action="/index.html" method="post">
            <p>
                <label for="title">Tytuł:</label>
                <input type="text" id="title" name="user_title"/>
            </p>
            <p>
                <label for="description">Opis:</label>
                <textarea id="description" name="user_description"></textarea>
            </p>
            <p>
                <label for="priority">Priorytet:</label>
                <select name="priority" id="priority">
                    <option value=""?>--Wybierz priorytet--
                    </option>
                    <option value="niski">Niski</option>
                    <option value="średni">Średni</option>
                    <option value="wysoki">Wysoki</option>
                </select>
            </p>
            <p class="button">
                <button type="submit">Wyślij</button>
            </p>
        </form>
        <h2>Aktualne zgłoszenie</h2>
    </body>
</html>
